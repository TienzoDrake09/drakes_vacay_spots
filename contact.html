<form>
  <fieldset>
    <legend>Contact Form</legend>
  <p>
    <label for="name">Your name</label><br>
    <input type="text" id="name" name="name" required>
  </p>
  <p>
    <label for="email">Your email</label><br>
    <input type="email" id="email" name="email" required>
  </p>
  </fieldset>
  <fieldset>
    <legend>Inquiry Details</legend>
  <p>
    <label for="subject">Subject:</label>
    <select id="subject" name="subject" required>
      <option value="suggestion-inquiry">Suggestion Inquiry</option>
      <option value="correction-inquiry">Correction Inquiry</option>
      <option value="information-inquiry">Information Inquiry</option>
      <option value="other-concerns">Other Concerns</option>
    </select>
  </p>

  <label for="message">Your Message:</label>
  <textarea id="message" name="message" rows="5" required></textarea>
  </fieldset>
  <button type="submit">Submit Inquiry</button>
</form>
